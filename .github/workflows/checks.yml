name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:static
      - run: npm run package:release
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: omd-static
          path: dist
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --shm-size=1g
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - scope: root
            base_path: ''
          - scope: project
            base_path: '/omd'
    env:
      OMD_BASE_PATH: ${{ matrix.base_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:static
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omd-browser-screenshots-${{ matrix.scope }}
          path: test-results
          if-no-files-found: ignore
  startup:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --shm-size=1g
    timeout-minutes: 10
    strategy:
      matrix:
        engine: [chromium, webkit]
        base_path: ['', '/omd']
    env:
      OMD_BROWSER: ${{ matrix.engine }}
      OMD_BASE_PATH: ${{ matrix.base_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run test:startup
      - run: npm run test:migration
      - run: npm run test:theme
      - run: npm run test:insertion
      - run: npm run test:checklist
      - run: npm run test:editor
      - run: npm run test:table
      - run: npm run test:tabs
