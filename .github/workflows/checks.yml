name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: omd-static
          path: dist
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omd-browser-screenshots
          path: test-results
          if-no-files-found: ignore
