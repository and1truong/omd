name: Release
on:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify release branch and version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(version)||process.env.GITHUB_REF_NAME!==`release/v${version}`)
            throw new Error('Run from release/vVERSION matching package.json.');
          appendFileSync(process.env.GITHUB_OUTPUT,`tag=v${version}\n`);
          NODE
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:static
      - run: npx playwright install --with-deps chromium
      - name: Native browser at origin root
        run: npm run test:browser
      - name: Native browser at GitHub Pages path
        env:
          OMD_BASE_PATH: /omd
        run: npm run test:browser
      - run: npm run package:release
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: omd-release
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: omd-release
          path: release
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          # Existing tags are immutable for this workflow; a retry never replaces a release.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /tmp/omd-release-tag
          tag_status=$?
          set -e
          if [ "$tag_status" -eq 0 ]; then
            echo "Tag already exists; refusing to replace $RELEASE_TAG."
            exit 1
          elif [ "$tag_status" -ne 2 ]; then
            echo "Unable to check release tag."
            exit "$tag_status"
          fi
          gh release create "$RELEASE_TAG" release/*.zip release/*.tar.gz release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "omd $RELEASE_TAG" --draft \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
