name: Release
on:
  push:
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify release branch and version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const {version}=JSON.parse(readFileSync('package.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(version)||process.env.GITHUB_REF_NAME!==`release/v${version}`)
            throw new Error('Run from release/vVERSION matching package.json.');
          appendFileSync(process.env.GITHUB_OUTPUT,`tag=v${version}\n`);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:static
      - run: npx playwright install --with-deps chromium
      - name: Native browser at origin root
        run: npm run test:browser
      - name: Native browser at GitHub Pages path
        env:
          OMD_BASE_PATH: /omd
        run: npm run test:browser
      - run: npm run package:release
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: omd-release
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
  desktop:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: omd-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: omd-desktop-*
          path: desktop-artifacts
      - name: Assemble verified desktop assets
        run: node scripts/collect-desktop-release.mjs
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          node scripts/publish-release.mjs
