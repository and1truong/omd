name: Desktop preview
on:
  push:
    branches: [main, feat/orchard-desktop]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.desktop/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:prepare
      - name: Native policy tests
        working-directory: .desktop/coconut-desktop-kit/src-tauri
        run: cargo test --locked --features tauri/custom-protocol
      - name: Build native debug driver
        if: runner.os == 'Linux'
        run: npm run desktop:build -- --debug --no-bundle
      - name: Native OMD acceptance
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Build unsigned preview installer
        run: npm run desktop:build
      - name: Installed Linux package acceptance
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i .desktop/target/release/bundle/deb/*.deb
          xvfb-run -a node desktop/test-package.mjs /usr/bin/omd-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: omd-desktop-${{ runner.os }}
          path: |
            .desktop/target/release/bundle/**/*.deb
            .desktop/target/release/bundle/**/*.dmg
            .desktop/target/release/bundle/**/*.exe
            .desktop/coconut-desktop-kit/omd-desktop.json
            .desktop/downloads/orchard-lime-extension-0.1.0.zip
          if-no-files-found: error
          retention-days: 14
  bridge-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --shm-size=1g
    strategy:
      matrix:
        engine: [chromium, webkit]
    env:
      OMD_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:bridge:browser
      - name: Prepare pinned Lime extension
        if: matrix.engine == 'chromium'
        run: apt-get update && apt-get install -y xz-utils unzip && npm run desktop:prepare
      - name: Released Lime against OMD
        if: matrix.engine == 'chromium'
        run: node desktop/test-lime.mjs
